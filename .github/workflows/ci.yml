# Copy this file into each game repo (.github/workflows/ci.yml). Paths assume the repo root
# is the Flutter project (the template's contents are the repo root).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned. Keep in sync with release.yml and the factory repo's .flutter-version.
  FLUTTER_VERSION: "3.47.8"

jobs:
  check:
    name: analyze, format, tests, safety checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format check
        run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - name: Ad safety (no real ad IDs in debug, no test IDs in release)
        run: bash scripts/ad_safety_check.sh
      - name: Assets license check
        run: bash scripts/check_asset_licenses.sh
      - name: No secrets committed
        run: bash scripts/no_secrets_check.sh

  build-debug:
    name: debug APK builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  # OPTIONAL, manual only (Actions tab -> ci -> Run workflow). The Android emulator needs
  # hardware acceleration (KVM). On GitHub-hosted runners it did not boot in our first run
  # ("Timeout waiting for emulator to boot"), so it no longer runs on every PR. Run the
  # integration test on a real device or a local emulator, or use a runner with KVM.
  emulator-integration-test:
    name: emulator integration test (optional)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run integration tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: flutter test integration_test
