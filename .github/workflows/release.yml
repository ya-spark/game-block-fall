# SKELETON release pipeline. Copy into each game repo.
# Builds a signed Android App Bundle and uploads it to the INTERNAL Play track.
#   - Push a version tag (v1.0.1, matching pubspec.yaml) to build and upload automatically.
#   - Or run it by hand (Actions > release > Run workflow); manual uploads to the internal track roll out immediately too.
# Production is NOT reachable from here: use the promote-production workflow once the internal
# build has been tested.
# It stops with a clear message while any required secret is unset. See docs/PLAY_SETUP.md
# in the game-factory repo for how to create each secret.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      track:
        description: Play track (production is only reachable through promote-production)
        type: choice
        options: [internal, alpha, beta]
        default: internal
      upload:
        description: Upload to Google Play (otherwise only build the AAB)
        type: boolean
        default: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.8"

jobs:
  release:
    runs-on: ubuntu-latest
    environment: internal # no reviewers here: tag pushes must run unattended
    env:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the pubspec version
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          version=$(awk '/^version:/{print $2}' pubspec.yaml | cut -d+ -f1)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error title=Tag mismatch::Tag ${GITHUB_REF_NAME} does not match pubspec.yaml version v${version}. Bump the version in pubspec.yaml, merge it, then tag that commit."
            exit 1
          fi

      - name: Check required secrets
        shell: bash
        run: |
          missing=()
          required="ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD"
          # The Play service account is only needed when this run uploads to Play
          # (every tag push, or a manual run with upload ticked).
          if [ "${{ inputs.upload }}" = "true" ] || [ "${{ github.event_name }}" = "push" ]; then required="PLAY_SERVICE_ACCOUNT_JSON $required"; fi
          for name in $required; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Missing secret::Release stopped. These repository secrets are not set: ${missing[*]}. See docs/PLAY_SETUP.md (service account + upload keystore) and add them under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "All required secrets are set."

      - name: Check real AdMob IDs are configured
        shell: bash
        run: |
          if awk '/^admob:/{a=1;next} /^[^ #]/{a=0} a && /^  release:/{r=1;next} a && /^  [a-z]+:/{r=0} a&&r' app.config.yaml | grep -q PLACEHOLDER; then
            echo "::error title=AdMob placeholders::app.config.yaml admob.release still has PLACEHOLDER values. Create the AdMob app + ad units and fill them in (docs/PLAY_SETUP.md)."
            exit 1
          fi
          bash scripts/ad_safety_check.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Write signing config (runner only, never committed)
        shell: bash
        run: |
          keystore="$RUNNER_TEMP/upload.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"
          {
            echo "storeFile=$keystore"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - name: Build signed app bundle
        run: flutter build appbundle --release --build-number ${{ github.run_number }}

      - name: Name the bundle after the app
        shell: bash
        run: |
          app_id=$(awk '/^app:/{a=1;next} a&&/^  id:/{print $2;exit}' app.config.yaml)
          version=$(awk '/^version:/{print $2}' pubspec.yaml | cut -d+ -f1)
          name="${app_id}-v${version}-b${{ github.run_number }}"
          package=$(awk '/^app:/{a=1;next} a&&/^  package_name:/{print $2;exit}' app.config.yaml | tr -d "\"'")
          echo "PACKAGE_NAME=${package}" >> "$GITHUB_ENV"
          # The Play release name is always the pubspec.yaml version name (no drift).
          echo "VERSION_NAME=${version}" >> "$GITHUB_ENV"
          mv build/app/outputs/bundle/release/app-release.aab "build/app/outputs/bundle/release/${name}.aab"
          echo "AAB_NAME=${name}" >> "$GITHUB_ENV"
          echo "AAB_PATH=build/app/outputs/bundle/release/${name}.aab" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.AAB_NAME }}
          path: ${{ env.AAB_PATH }}
          retention-days: 30

      - name: Upload to Google Play
        if: ${{ inputs.upload || github.event_name == 'push' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ env.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }} # read from app.config.yaml
          releaseFiles: ${{ env.AAB_PATH }}
          releaseName: ${{ env.VERSION_NAME }} # label in Play Console = pubspec.yaml version name
          track: ${{ inputs.track || 'internal' }}
          # The internal track always rolls out to internal testers immediately (tag push or manual run).
          # Other tracks stay drafts. Production is only reachable through promote-production.
          status: ${{ (github.event_name == 'push' || inputs.track == 'internal') && 'completed' || 'draft' }}

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/upload.jks"
