# SKELETON release pipeline. Copy into each game repo.
# Builds a signed Android App Bundle and uploads it to the CLOSED testing (alpha) Play track by default.
#   - Push a version tag (v1.0.1, matching pubspec.yaml) to build and upload automatically.
#   - Or run it by hand (Actions > release > Run workflow). The track defaults to alpha (closed testing); uploads there go live to the closed testers at once (beta stays a draft until rolled out in Play Console).
# Internal is never used unless chosen explicitly (owner, 2026-11-09). Production is NOT reachable from here:
# use the promote-production workflow once the closed-testing build has been tested.
# It stops with a clear message while any required secret is unset. See docs/PLAY_SETUP.md
# in the game-factory repo for how to create each secret.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      track:
        description: Play track (production is only reachable through promote-production)
        type: choice
        options: [alpha, beta, internal]
        default: alpha
      upload:
        description: Upload to Google Play (otherwise only build the AAB)
        type: boolean
        default: false
      test_apks:
        description: Also build an installable release APK (same signing and R8 settings as the bundle) for on-device testing
        type: boolean
        default: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.8"

jobs:
  release:
    runs-on: ubuntu-latest
    environment: internal # no reviewers here: tag pushes must run unattended
    env:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the pubspec version
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          version=$(awk '/^version:/{print $2}' pubspec.yaml | cut -d+ -f1)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error title=Tag mismatch::Tag ${GITHUB_REF_NAME} does not match pubspec.yaml version v${version}. Bump the version in pubspec.yaml, merge it, then tag that commit."
            exit 1
          fi

      - name: Check required secrets
        shell: bash
        run: |
          missing=()
          required="ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD"
          # The Play service account is only needed when this run uploads to Play
          # (every tag push, or a manual run with upload ticked).
          if [ "${{ inputs.upload }}" = "true" ] || [ "${{ github.event_name }}" = "push" ]; then required="PLAY_SERVICE_ACCOUNT_JSON $required"; fi
          for name in $required; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Missing secret::Release stopped. These repository secrets are not set: ${missing[*]}. See docs/PLAY_SETUP.md (service account + upload keystore) and add them under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "All required secrets are set."

      - name: Check real AdMob IDs are configured
        shell: bash
        run: |
          if awk '/^admob:/{a=1;next} /^[^ #]/{a=0} a && /^  release:/{r=1;next} a && /^  [a-z]+:/{r=0} a&&r' app.config.yaml | grep -q PLACEHOLDER; then
            echo "::error title=AdMob placeholders::app.config.yaml admob.release still has PLACEHOLDER values. Create the AdMob app + ad units and fill them in (docs/PLAY_SETUP.md)."
            exit 1
          fi
          bash scripts/ad_safety_check.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Write signing config (runner only, never committed)
        shell: bash
        run: |
          keystore="$RUNNER_TEMP/upload.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"
          {
            echo "storeFile=$keystore"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - name: Build signed app bundle
        run: flutter build appbundle --release --build-number ${{ github.run_number }}

      - name: Report whether the bundle asks for the advertising ID
        if: always()
        shell: bash
        run: |
          # The ads library adds com.google.android.gms.permission.AD_ID; the app manifest removes it.
          # Information only: look at the built bundle itself and at the app module's merger report.
          aab=build/app/outputs/bundle/release/app-release.aab
          if [ -f "$aab" ]; then
            if unzip -p "$aab" base/manifest/AndroidManifest.xml | strings | grep -q 'permission.AD_ID'; then
              echo "::warning title=AD_ID in bundle::the built bundle manifest declares AD_ID"
            else
              echo "AD_ID is absent from the built bundle manifest"
            fi
            echo "permissions in the bundle:"; unzip -p "$aab" base/manifest/AndroidManifest.xml | strings | grep -E '^(android|com\.google)\.?.*permission' | sort -u
          else
            echo "no bundle found at $aab"
          fi
          report=build/app/outputs/logs/manifest-merger-release-report.txt
          if [ -f "$report" ]; then grep -n -B2 -A4 'AD_ID' "$report" || echo "AD_ID not mentioned in $report"; else echo "no merger report at $report"; find build/app -name 'manifest-merger*' 2>/dev/null | head; fi

      - name: Find every place the bundle mentions the advertising ID permission
        if: always()
        shell: bash
        run: |
          # Information only: list each file inside the bundle whose bytes contain the permission name,
          # plus the permission lines of every release manifest the build produced.
          aab=build/app/outputs/bundle/release/app-release.aab
          if [ -f "$aab" ]; then
            echo "files inside the bundle that contain permission.AD_ID:"
            unzip -Z1 "$aab" | while read -r f; do
              n=$(unzip -p "$aab" "$f" 2>/dev/null | grep -a -c 'permission.AD_ID' || true)
              if [ "${n:-0}" -gt 0 ]; then echo "  $f ($n)"; fi
            done
            echo "all uses-permission strings in the base manifest:"
            unzip -p "$aab" base/manifest/AndroidManifest.xml | strings | grep -a 'permission' | sort -u
          fi
          for m in $(find build/app -name AndroidManifest.xml -path '*release*' 2>/dev/null | head -8); do
            echo "== $m"; grep -n 'permission' "$m" | grep -i 'AD_ID\|ADSERVICES' || echo "  no AD_ID or ADSERVICES permission lines"
          done

      - name: Name the bundle after the app
        shell: bash
        run: |
          app_id=$(awk '/^app:/{a=1;next} a&&/^  id:/{print $2;exit}' app.config.yaml)
          version=$(awk '/^version:/{print $2}' pubspec.yaml | cut -d+ -f1)
          name="${app_id}-v${version}-b${{ github.run_number }}"
          package=$(awk '/^app:/{a=1;next} a&&/^  package_name:/{print $2;exit}' app.config.yaml | tr -d "\"'")
          echo "PACKAGE_NAME=${package}" >> "$GITHUB_ENV"
          # Versioning rule: pubspec.yaml holds only the version name (x.y.z). The Play version code is
          # this run's number (--build-number below) and the Play release name is "<name> (<code>)".
          echo "RELEASE_NAME=${version} (${{ github.run_number }})" >> "$GITHUB_ENV"
          mv build/app/outputs/bundle/release/app-release.aab "build/app/outputs/bundle/release/${name}.aab"
          echo "AAB_NAME=${name}" >> "$GITHUB_ENV"
          echo "AAB_PATH=build/app/outputs/bundle/release/${name}.aab" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.AAB_NAME }}
          path: ${{ env.AAB_PATH }}
          retention-days: 30

      - name: Build test APK (release, same settings as the bundle)
        if: ${{ inputs.test_apks }}
        shell: bash
        run: |
          flutter build apk --release --build-number ${{ github.run_number }}
          mv build/app/outputs/flutter-apk/app-release.apk "build/${AAB_NAME}-release.apk"

      - name: Upload test APK
        if: ${{ inputs.test_apks }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.AAB_NAME }}-test-apk
          path: build/*.apk
          retention-days: 7

      - name: Upload to Google Play
        if: ${{ inputs.upload || github.event_name == 'push' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ env.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }} # read from app.config.yaml
          releaseFiles: ${{ env.AAB_PATH }}
          releaseName: ${{ env.RELEASE_NAME }} # Play label = "<pubspec version name> (<version code>)"
          # Release notes shown to testers: store/google-play/whatsnew/whatsnew-en-US (500 characters at most). Edit it before each release.
          whatsNewDirectory: store/google-play/whatsnew
          track: ${{ inputs.track || 'alpha' }}
          # Closed testing (alpha), the default for tag pushes and manual runs, goes live to testers at once
          # (owner, 2026-11-09), and so does an explicitly chosen internal track. Beta stays a draft.
          # Production is only reachable through promote-production.
          status: ${{ inputs.track == 'beta' && 'draft' || 'completed' }}

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/upload.jks"
