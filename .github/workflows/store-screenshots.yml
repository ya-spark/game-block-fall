# Uploads store/google-play/graphics/screenshots/phone-*.png to the Play store listing (replaces all phone screenshots
# of the chosen locale). Manual only. Dry run by default: tick "upload" to really change the listing.
name: store-screenshots

on:
  workflow_dispatch:
    inputs:
      locale:
        description: Store listing language
        default: en-US
      upload:
        description: Really upload (otherwise a dry run that only lists the files)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    environment: internal
    env:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet google-auth requests
      - name: Upload the screenshots
        run: |
          if [ "${{ inputs.upload }}" = "true" ]; then
            python3 scripts/play_store_screenshots.py --locale "${{ inputs.locale }}" --upload
          else
            python3 scripts/play_store_screenshots.py --locale "${{ inputs.locale }}"
          fi
